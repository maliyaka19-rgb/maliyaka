# NEXUS-CORE CI/CD Pipeline
# Phase 3.4: Automated testing & deployment

name: NEXUS-CORE CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('multimodal-studio/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd multimodal-studio/backend
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx beautifulsoup4

    - name: Run calculator & tools tests
      run: |
        cd multimodal-studio/backend
        python -m pytest tests/test_calculator.py tests/test_tools_spec.py -v --tb=short

    - name: Run catalog & memory tests
      run: |
        cd multimodal-studio/backend
        python -m pytest tests/test_catalog_memory.py -v --tb=short

    - name: Import check (all modules load)
      run: |
        cd multimodal-studio/backend
        python -c "import web_tools, tools_spec, memory, tool_executor; print('All modules OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install linter
      run: pip install ruff

    - name: Lint backend (errors only)
      run: |
        cd multimodal-studio/backend
        ruff check --select=E9,F63,F7,F82 --output-format=github .

  frontend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify frontend structure
      run: |
        cd multimodal-studio
        test -f sohbet.html || exit 1
        test -f css/style.css || exit 1
        test -f js/app.js || exit 1
        grep -q "css/style.css" sohbet.html || exit 1
        grep -q "js/app.js" sohbet.html || exit 1
        echo "Frontend structure OK"

    - name: Check JS syntax (node)
      run: |
        cd multimodal-studio
        node --check js/app.js 2>/dev/null && echo "JS syntax OK" || echo "JS check skipped (node unavailable)"
