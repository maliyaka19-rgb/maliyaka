# NEXUS-CORE CI/CD Pipeline
# Phase 3.4: Automated testing & deployment

name: NEXUS-CORE CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('multimodal-studio/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd multimodal-studio/backend
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx beautifulsoup4

    - name: Run unit tests (live hariç)
      run: |
        cd multimodal-studio/backend
        set +e
        python -m pytest tests/ -v --tb=short 2>&1 | tee pytest.log
        code=${PIPESTATUS[0]}
        if [ "$code" -ne 0 ]; then
          echo "----- Basarisiz test ozetleri -----"
          grep -E "^(FAILED|ERROR)" pytest.log | head -n 25 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
            echo "::error title=pytest::$msg"
          done
          exit "$code"
        fi

    - name: Import check (all modules load)
      run: |
        cd multimodal-studio/backend
        python -c "import web_tools, tools_spec, memory, tool_executor, rag_system, ai_agent, app, custom_agents, coding_manager, coding_routes, telegram_bot; print('All modules OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install linter
      run: pip install ruff

    - name: Lint backend (errors only)
      run: |
        cd multimodal-studio/backend
        ruff check --select=E9,F63,F7,F82 --output-format=github .

  frontend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify frontend structure
      run: |
        cd multimodal-studio
        test -f sohbet.html || exit 1
        test -f css/style.css || exit 1
        test -f js/app.js || exit 1
        grep -q "css/style.css" sohbet.html || exit 1
        grep -q "js/app.js" sohbet.html || exit 1
        echo "Frontend structure OK"

    - name: Check JS syntax (node)
      run: |
        cd multimodal-studio
        node --check js/app.js 2>/dev/null && echo "JS syntax OK" || echo "JS check skipped (node unavailable)"
