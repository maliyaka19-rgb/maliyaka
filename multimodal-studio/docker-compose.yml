# backend/docker-compose.yml - Development & Production orchestration

version: "3.8"

services:
  # FastAPI Backend Service
  backend:
    build: ./backend
    container_name: multimodal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Next.js Application
  frontend:
    image: node:20-alpine
    container_name: multimodal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      bash -c "
      npm install &&
      npm run dev
      "
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

  # PostgreSQL Database (for production)
  db:
    image: postgres:15-alpine
    container_name: multimodal-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=multimodal_studio
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d multimodal_studio"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for caching, sessions)
  redis:
    image: redis:7-alpine
    container_name: multimodal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data: